name: CI

on:
  push:
    # branches:
    #   - main
    paths-ignore:
      - 'README.md'
      - 'CODE_OF_CONDUCT.md'
      - '.editorconfig'
      - '.spi.yml'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test MacOS
    runs-on: macOS-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app
    strategy:
      matrix:
        destination:
          - "platform=macOS"
          - "platform=macOS,variant=Mac Catalyst"
          - "platform=iOS Simulator,name=iPhone 17e"
          - "platform=iOS Simulator,name=iPhone Air"
          # - "platform=tvOS Simulator,name=Apple TV"
          # - "platform=watchOS Simulator,name=Apple Watch Series 10 (42mm)"
          # - "platform=visionOS Simulator,name=Apple Vision Pro"
    steps:
      - uses: actions/checkout@v5
      - name: Test platform ${{ matrix.destination }}
        run: set -o pipefail && xcodebuild -skipMacroValidation -scheme AtprotoClient-Package -destination "${{ matrix.destination }}" test | xcbeautify
  mocks:
    name: Build Mock on MacOS
    runs-on: macOS-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app
    strategy:
      matrix:
        destination:
          - "platform=macOS"
          - "platform=macOS,variant=Mac Catalyst"
          - "platform=iOS Simulator,name=iPhone 17e"
          - "platform=iOS Simulator,name=iPhone Air"
          # - "platform=tvOS Simulator,name=Apple TV"
          # - "platform=watchOS Simulator,name=Apple Watch Series 10 (42mm)"
          # - "platform=visionOS Simulator,name=Apple Vision Pro"
    steps:
      - uses: actions/checkout@v5
      - name: Test platform ${{ matrix.destination }}
        run: set -o pipefail && xcodebuild -skipMacroValidation -scheme AtprotoClientMocks -destination "${{ matrix.destination }}" build | xcbeautify
  linux_test:
    name: Test Linux
    runs-on: ubuntu-latest
    container:
      image: swift:${{matrix.swift-version}}
    timeout-minutes: 30
    strategy:
      matrix:
        swift-version:
          - "latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: swift --version
      - name: Test
        run: swift test

  linux-android:
    name: Test Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: "Test Swift Package on Android"
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: '6.3'

